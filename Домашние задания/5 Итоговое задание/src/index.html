<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Battle Arena</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="game-container">
        <div class="battle-header">
            <h1>RPG Battle Arena</h1>
            <div class="round-info">
                <span class="round-number">Раунд: 1</span>
            </div>
        </div>

        <div class="battle-field">
            <div class="game-board">
                <div class="board-positions">
                    <!-- Позиции будут добавлены динамически -->
                </div>
                <div class="players-list">
                    <!-- Игроки будут добавлены динамически -->
                </div>
            </div>

            <div class="battle-log">
                <h3>Журнал боя</h3>
                <div class="log-content"></div>
            </div>
        </div>

        <div class="game-controls">
            <button id="start-battle" class="control-btn">Начать битву</button>
            <button id="next-round" class="control-btn" disabled>Следующий раунд</button>
            <button id="reset-game" class="control-btn" disabled>Новая игра</button>
        </div>
    </div>

    <template id="player-template">
        <div class="player-card">
            <div class="player-info">
                <h3 class="player-name"></h3>
                <p class="player-description"></p>
            </div>
            <div class="player-stats">
                <div class="stat">
                    <span class="stat-label">❤️ Жизнь:</span>
                    <div class="health-bar">
                        <div class="health-fill"></div>
                    </div>
                    <span class="health-text"></span>
                </div>
                <div class="stat">
                    <span class="stat-label">✨ Мана:</span>
                    <div class="mana-bar">
                        <div class="mana-fill"></div>
                    </div>
                    <span class="mana-text"></span>
                </div>
                <div class="weapon-info">
                    <span class="stat-label">🗡️ Оружие:</span>
                    <span class="weapon-name"></span>
                    <div class="durability-bar">
                        <div class="durability-fill"></div>
                    </div>
                </div>
            </div>
            <div class="player-status"></div>
        </div>
    </template>

    <script type="module" src="game.js"></script>
</body>
</html>
